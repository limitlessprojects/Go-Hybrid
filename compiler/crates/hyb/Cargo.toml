[package]
name = "hyb"
version.workspace = true
edition.workspace = true
license.workspace = true

# hyb — the Hybrid CLI (MVP-0 shape):
#   hyb check <file.hy> [--json] [--report-managed]
#   hyb explain <code>          (offline registry reference page)
#   hyb build <file.hy> -o dir  (MVP-0 walking skeleton: parse → check →
#                                emit Go source → `go build`; version-pin
#                                enforcement rides along, dx study item)

[[bin]]
name = "hyb"
path = "src/main.rs"

[dependencies]
hy-syntax = { path = "../hy-syntax" }
hy-check = { path = "../hy-check" }
hy-diag = { path = "../hy-diag" }
hy-emit = { path = "../hy-emit" }

# Reuse the existing test dependency to read Go's file-selection JSON.
serde_json = "1"

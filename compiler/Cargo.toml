[workspace]
resolver = "2"
members = [
    "crates/hy-diag",
    "crates/hy-syntax",
    "crates/hy-check",
    "crates/hy-emit",
    "crates/hyb",
    "crates/hy-wasm",
]

# Go-Hybrid compiler workspace — PLAN.md 2026-10-11 decision:
# implementation language Rust, small crates, cargo check loop in-sandbox,
# full builds on tiers.  Dependencies are deliberately near-zero: serde_json
# is the only tree (diagnostic JSON envelope + registry data), keeping the
# 2-core sandbox loop fast and hermetic.  Adding a dependency is a logged
# decision (PLAN.md Decision Log).

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Go-Hybrid contributors"]

[profile.dev]
debug = 0
opt-level = 0

[profile.release]
opt-level = 2
debug = 0

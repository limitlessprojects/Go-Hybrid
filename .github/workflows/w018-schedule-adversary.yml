name: W-018 schedule adversary

on:
  push:
    branches: [main]
    paths:
      - 'spikes/spike18-schedule-adversary/**'
      - '.github/workflows/w018-schedule-adversary.yml'
  pull_request:
    paths:
      - 'spikes/spike18-schedule-adversary/**'
      - '.github/workflows/w018-schedule-adversary.yml'

permissions:
  contents: read

jobs:
  schedule-adversary:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spikes/spike18-schedule-adversary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - name: Replay, state exploration, emitted Go and allocation checks
        run: go test -v -count=1 ./...
      - name: Vet and formatting
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Oracle and runtime guard negative controls
        run: python3 check_mutations.py

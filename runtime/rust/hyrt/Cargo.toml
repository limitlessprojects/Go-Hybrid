[package]
name = "hyrt"
version = "0.1.0"
edition = "2021"
description = "The Hybrid runtime bridge — extern C wrappers over the pinned crates (sha3, sha2, flate2, ed25519-dalek, serde_json, regex). Loaded as WASM module or staticlib."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sha3 = "=0.10.8"
sha2 = "=0.10.8"
serde_json = { version = "=1.0.140", default-features = false, features = ["alloc"] }
regex = { version = "=1.11.1", default-features = false, features = ["std", "perf", "unicode"] }
flate2 = { version = "=1.0.35", default-features = false, features = ["zlib-rs"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
debug = false
panic = "abort"
codegen-units = 1
